[project]
name = "reglamento-transito-api"
version = "0.1.0"
description = "API de consulta del Reglamento de Tránsito de la CDMX (RAG con citas verificadas)"
requires-python = ">=3.11"
# Sin PyTorch: los embeddings y el LLM se consumen por API (servidor de inferencia en GPU).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.3",
    "qdrant-client>=1.12",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
